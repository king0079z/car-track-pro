# ── CarTrack ALL-IN-ONE (frontend + backend on ONE VM, no Vercel) ────────────
# Designed for Oracle Cloud's free Ampere A1 (ARM64), but also runs on x86.
#
#   web  (Caddy + React SPA)  ──/api,/ws──►  backend (FastAPI + YOLO/OCR + P2P)
#        │ auto-HTTPS (Let's Encrypt)
#        ▼
#   Browser anywhere
#
# Usage on the VM:
#   cd "Car Tracking system/deploy/cloud"
#   cp .env.cloud.example .env.cloud           # fill serial/password
#   export CADDY_DOMAIN=yourname.duckdns.org
#   docker compose -f docker-compose.oracle.yml up -d --build
# (setup-oracle.sh does all of this for you.)

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: cartrack_backend
    restart: always
    env_file:
      - .env.cloud
    environment:
      PORT: "8000"
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      # YOLO/OCR weights are NOT in git — delivered to ./data/models on the VM and
      # mounted read-only here (survives redeploys, no need to commit binaries).
      - ./data/models:/app/models:ro
      # Persist the camera registry + databases across redeploys.
      - ./data/cameras.json:/app/cameras.json
      - ./data/cartrack.db:/app/cartrack.db
      - ./data/live_sessions.db:/app/live_sessions.db
      - ./data/analysis_history.db:/app/analysis_history.db
    networks:
      - cartrack_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Caddy serves the React SPA (static) AND auto-HTTPS reverse-proxies /api + /ws
  # to the backend. The frontend bundle is baked into this image at build time.
  web:
    build:
      context: ../..
      dockerfile: deploy/cloud/frontend.Dockerfile
    container_name: cartrack_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN to your DuckDNS/host domain}
    volumes:
      - ./Caddyfile.oracle:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - cartrack_net

volumes:
  uploads_data:
    driver: local
  outputs_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  cartrack_net:
    driver: bridge
