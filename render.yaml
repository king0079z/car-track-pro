# CarTrack API on Render — https://render.com/docs/blueprint-spec
# Connect repo → New Blueprint → use this file.
# Then set VITE_API_URL on Vercel to the Render service URL (https://cartrack-api.onrender.com).

services:
  - type: web
    name: cartrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./cartrack.db
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://cartrackpro.duckdns.org,https://frontend-delta-amber-41.vercel.app"
      - key: LIVE_RESUME_ON_STARTUP
        value: "false"
      - key: LIVE_PROBE_CAMERAS_ON_STARTUP
        value: "false"
      - key: LIVE_24_7_ENABLED
        value: "false"
      - key: USE_GPU
        value: "false"
      # Dahua Easy4IP cloud (DMSS-style, no on-site PC) — set on VPS, not Vercel
      - key: DAHUA_DEVICE_SERIAL
        sync: false
      - key: DAHUA_PASSWORD
        sync: false
      - key: DAHUA_CONNECTION_MODE
        value: "p2p"
      - key: DAHUA_P2P_PREWARM_ON_STARTUP
        value: "true"
