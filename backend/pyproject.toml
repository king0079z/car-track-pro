[project]
name = "cartrack-backend"
version = "0.0.0"
description = "CarTrack Pro API"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
src = ["tests"]
extend-exclude = ["venv", "vendor", ".venv", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: optional tests that load OCR/YOLO models (run with pytest -m slow)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/vendor/*", "*/venv/*"]
