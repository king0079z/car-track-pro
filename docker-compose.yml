version: "3.9"

# ── CarTrack Pro — Production Docker Compose ──────────────────────────────────
# Usage:
#   1. Copy .env.production.example → .env.production and fill in real values
#   2. docker compose --env-file .env.production up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cartrack_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cartrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cartrack_pass}
      POSTGRES_DB: ${DB_NAME:-cartrack_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cartrack} -d ${DB_NAME:-cartrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cartrack_net

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cartrack_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cartrack}:${DB_PASSWORD:-cartrack_pass}@db:5432/${DB_NAME:-cartrack_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env.production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE_MINUTES:-480}
      DEBUG: "false"
      APP_NAME: "CarTrack Pro"
      APP_VERSION: "1.0.0"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      USE_GPU: "false"
      AI_CONFIDENCE_THRESHOLD: "0.70"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads_data:/app/uploads
      - ./ai/models:/app/ai/models:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cartrack_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Frontend + Nginx ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # Empty = use relative URLs (nginx proxies /api → backend)
    container_name: cartrack_frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cartrack_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  cartrack_net:
    driver: bridge
